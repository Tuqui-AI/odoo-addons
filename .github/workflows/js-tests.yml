name: JS tests (Hoot)

# Interaction tests running against a real Odoo, with no LLM.
#
# Why here and not in the Tuqui repo: what breaks is JavaScript running INSIDE
# Odoo's web client (`applyProposal` over OWL's record model). A test hitting it
# over RPC does not touch that, and standing up the whole stack with a browser
# driving the SPA is far more expensive for less coverage.
#
# Spec: assistant-en-odoo-confiabilidad §Tests reales — task 72555.
#
# ── How Hoot tests are run, which is not obvious ────────────────────────────
#
# The runner does NOT live in the addon: it is
# `web.tests.test_js.WebSuite.test_unit_desktop`, a `post_install` HttpCase of
# the `web` module that opens headless Chrome against `/web/tests` and runs the
# WHOLE `web.assets_unit_tests` bundle. Hence the two odd parts of the command:
#
#   -u web            → without it, `web`'s post-tests do not join the run
#                       (Odoo only runs tests of the modules it installs or
#                       updates), and not a single JS test executes.
#   [@tuqui_assistant] → a tag parameter filtering the Hoot suite down to THIS
#                       addon's tests, so a broken core test does not paint the
#                       PR red. Without the filter, thousands of foreign tests
#                       run.
#
# ── Why a browser and python3-websocket get installed ───────────────────────
#
# The official `odoo:19` image ships neither, and when either is missing the
# test does NOT fail: it does `unittest.SkipTest` and the job goes GREEN having
# run nothing. That is why, besides the install, there is a final step verifying
# in the log that the suite actually executed — an empty green is worse than a
# red.
#
# Chrome cannot be swapped for Ubuntu's `chromium`: the image is noble (24.04),
# where `chromium-browser` is the snap transition stub and does not start inside
# a container. It has to be Google's package.

on:
  push:
    branches:
      - "1[8-9].0"
      - "[2-9][0-9].0"
  pull_request:
    branches:
      - "1[8-9].0*"
      - "[2-9][0-9].0*"

jobs:
  hoot:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One addon per run, rather than all of them behind a single filter: a
        # red result then says WHICH suite broke, and an addon with no browser
        # cannot hide the other.
        addon: [tuqui_assistant, tuqui_embed]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        # The job runs INSIDE the container, where Actions resolves the shell on
        # its own and may land on `sh` (dash): there `set -o pipefail` is a
        # syntax error and the step dies before running a single test. The image
        # ships bash; we ask for it explicitly.
        shell: bash
    container:
      # Pinned to the repo's major: a version branch is only tested against its
      # own Odoo. `--user root` is needed to install the browser; Chrome runs
      # headless, which already implies `--no-sandbox`, so root does not break
      # it.
      image: odoo:19
      options: --user root
    steps:
      - uses: actions/checkout@v4
        with:
          path: addons/tuqui-ai

      - name: Install the test browser and the websocket client
        run: |
          set -eux
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            ca-certificates gnupg wget python3-websocket
          wget -qO- https://dl.google.com/linux/linux_signing_key.pub \
            | gpg --dearmor -o /usr/share/keyrings/google-chrome.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" \
            > /etc/apt/sources.list.d/google-chrome.list
          apt-get update -qq
          apt-get install -y --no-install-recommends google-chrome-stable
          google-chrome --version
          python3 -c "import websocket"

      - name: Run the addon's Hoot suite (${{ matrix.addon }})
        run: |
          set -o pipefail
          odoo \
            --db_host postgres --db_user odoo --db_password odoo \
            --addons-path "/usr/lib/python3/dist-packages/odoo/addons,${GITHUB_WORKSPACE}/addons/tuqui-ai" \
            --data-dir /tmp/odoo-data \
            -d hoot_test \
            -i ${{ matrix.addon }} -u web \
            --without-demo=True \
            --test-enable \
            --test-tags "/web:WebSuite.test_unit_desktop[@${{ matrix.addon }}]" \
            --stop-after-init \
            --log-level=test 2>&1 | tee /tmp/hoot.log

      - name: Fail if the suite did not actually run
        # A safety net against the empty green: if the browser was missing, if
        # websocket-client was missing, or if the filter stopped matching
        # (because the addon or the test files were renamed), nothing above
        # fails. Here it does.
        run: |
          if ! grep -q '\[HOOT\] "@${{ matrix.addon }}" ended' /tmp/hoot.log; then
            echo "::error::The Hoot suite for ${{ matrix.addon }} did not run."
            echo "Check whether the job skipped the tests (browser or"
            echo "websocket-client missing) or whether --test-tags stopped matching."
            grep -iE 'skip|not installed' /tmp/hoot.log || true
            exit 1
          fi
          grep '\[HOOT\] "@${{ matrix.addon }}" ended' /tmp/hoot.log
